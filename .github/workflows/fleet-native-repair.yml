name: Native compiler repair checks
on:
  push:
    branches: ['codex/fleet-repair-checks-20261111']
    paths: ['work/native-validation/**', '.github/workflows/fleet-native-repair.yml']
permissions:
  contents: read
jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute actual Mach-O programs and compiler generations
        run: |
          mkdir -p "$RUNNER_TEMP/sovren-native-repair"
          tar -xzf work/native-validation/macos-validation.tar.gz -C "$RUNNER_TEMP/sovren-native-repair"
          cp work/native-validation/check_macos_native.py "$RUNNER_TEMP/sovren-native-repair/"
          python3 "$RUNNER_TEMP/sovren-native-repair/check_macos_native.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-repair-report
          path: ${{ runner.temp }}/sovren-native-repair/macos-native-report.json
