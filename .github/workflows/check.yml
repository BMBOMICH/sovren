name: check

# Every push is tested on real machines: a real Windows box and a
# real Mac, both free from GitHub, plus Linux. Nobody has to test by
# hand. If something breaks, the log says exactly what and why.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  # ------------------------------------------------------------------
  windows:
    name: Windows on real hardware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: which machine is this
        shell: pwsh
        run: |
          $c = Get-CimInstance Win32_Processor
          "cpu      : $($c.Name)"
          "cores    : $($c.NumberOfCores)"
          "windows  : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          "If a later step dies with exit -1073741795 the cpu above is"
          "missing an instruction the compiler emitted."

      - name: the exe is well formed before running it
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("sovren.exe")
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "not a PE file" }
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $chars = [BitConverter]::ToUInt16($b, $pe + 22)
          $dll = [BitConverter]::ToUInt16($b, $pe + 24 + 70)
          "Characteristics    : 0x{0:X}" -f $chars
          "DllCharacteristics : 0x{0:X}" -f $dll
          # S7 re-landed: PIE with a loader-applied .reloc table. The
          # table must be named in DataDirectory[5] - the first
          # landing missed the slot by one and windows refused it.
          if (($chars -band 1) -ne 0) { throw "RELOCS_STRIPPED set: a PIE exe must carry its relocs" }
          if (($dll -band 0x40) -eq 0) { throw "DYNAMIC_BASE not set: ASLR is off" }
          $nsec = [BitConverter]::ToUInt16($b, $pe + 6)
          "Sections           : $nsec"
          if ($nsec -ne 3) { throw "expected three sections (.text/.rdata/.reloc), got $nsec" }
          $r5off = $pe + 24 + 112 + 40
          $r5r = [BitConverter]::ToUInt32($b, $r5off)
          $r5s = [BitConverter]::ToUInt32($b, $r5off + 4)
          "RelocDir[5]        : 0x$r5r / $r5s bytes"
          if ($r5s -lt 12) { throw "DataDirectory[5] is empty: the reloc table is unnamed" }
          # walk the blocks: they must fill the table exactly
          $sec3 = $pe + 24 + 240 + 2 * 40
          $raw3 = [BitConverter]::ToUInt32($b, $sec3 + 20)
          $pos = 0; $dir64 = 0
          while ($pos + 8 -le $r5s) {
            $bsz = [BitConverter]::ToUInt32($b, $raw3 + $pos + 4)
            if ($bsz -lt 8) { throw "a reloc block smaller than its head" }
            for ($j = 0; $j -lt [int](($bsz - 8) / 2); $j++) {
              $ew = [BitConverter]::ToUInt16($b, $raw3 + $pos + 8 + $j * 2)
              if (($ew -shr 12) -eq 10) { $dir64 = 1 }
            }
            $pos += $bsz
          }
          if ($pos -ne $r5s) { throw "reloc blocks fill $pos of $r5s bytes" }
          if ($dir64 -eq 0) { throw "no DIR64 entry in the table" }
          "reloc blocks       : exact fill, DIR64 present"

          $n = 0
          for ($i = 0; $i -lt $b.Length - 1; $i++) { if ($b[$i] -eq 0x0F -and $b[$i+1] -eq 0x05) { $n++ } }
          "raw linux syscall instructions: $n"
          if ($n -ne 0) { throw "the exe contains raw linux syscalls, which do nothing on Windows" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: sovren.exe starts
        shell: pwsh
        run: |
          # with no arguments it prints how to use it and exits 1.
          # that is correct. anything negative is a crash.
          $out = (.\sovren.exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $out.Trim()
          "exit=$code"
          if ($code -lt 0) { throw "crashed on startup, exit $code" }
          if ($out -notmatch "Usage") { throw "did not print its usage line" }
          # a pwsh step ends with whatever the last program returned,
          # so clear it or this step reports failure despite passing
          $global:LASTEXITCODE = 0
          exit 0

      - name: tests/hello.sov
        shell: pwsh
        run: |
          .\sovren.exe tests/hello.sov -o hello.exe
          if ($LASTEXITCODE -ne 0) { throw "compile failed, exit $LASTEXITCODE" }
          if (-not (Test-Path hello.exe)) { throw "nothing was written" }
          $o = (.\hello.exe | Out-String).Trim()
          $o
          if ($LASTEXITCODE -ne 0) { throw "run failed, exit $LASTEXITCODE" }
          if ($o -notmatch "Hello from Sovren") { throw "wrong output" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: the language itself
        shell: pwsh
        run: |
          function Try-One($name, $src, $want) {
            $src | Set-Content -NoNewline t.sov
            .\sovren.exe t.sov -o t.exe 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name : compile failed, exit $LASTEXITCODE" }
            $g = (.\t.exe | Out-String).Trim() -replace "`r`n", " "
            "{0,-22} {1}" -f $name, $g
            if ($g -ne $want) { throw "$name : wanted '$want', got '$g'" }
          }
          Try-One "add"          "main:`n    print 2 + 2" "4"
          Try-One "precedence"   "main:`n    print 5 * 3 / 2" "7"
          Try-One "remainder"    "main:`n    print 7 % 3" "1"
          Try-One "brackets"     "main:`n    print (2 + 3) * 4" "20"
          Try-One "negative"     "main:`n    print 0 - 42" "-42"
          Try-One "text"         "main:`n    print `"hello`"" "hello"
          Try-One "if"           "main:`n    if 3 > 2`n        print `"yes`"" "yes"
          Try-One "if not"       "main:`n    if 1 > 2`n        print `"no`"`n    if not`n        print `"else`"" "else"
          Try-One "and or"       "main:`n    if 1 is 1 and 2 is 2`n        print `"both`"" "both"
          Try-One "loop"         "main:`n    i: 0`n    as long as i < 3`n        print i`n        i: i + 1" "0 1 2"
          Try-One "job"          "add a b:`n    return a + b`n`nmain:`n    print add(40, 2)" "42"
          Try-One "recursion"    "fib n:`n    if n < 2`n        return n`n    return fib(n - 1) + fib(n - 2)`n`nmain:`n    print fib(20)" "6765"
          Try-One "times"        "main:`n    print `"x`" 3 times" "x x x"
          Try-One "stop"         "main:`n    print 1`n    stop`n    print 2" "1"
          Try-One "as text int"  "main:`n    x: 65`n    print as text x" "65"
          $global:LASTEXITCODE = 0
          exit 0

      - name: errors are reported, not ignored
        shell: pwsh
        run: |
          function Must-Fail($name, $src) {
            $src | Set-Content -NoNewline bad.sov
            $out = (.\sovren.exe bad.sov -o bad.exe 2>&1 | Out-String)
            "{0,-22} exit={1}" -f $name, $LASTEXITCODE
            if ($LASTEXITCODE -eq 0) { throw "$name : should have been rejected but compiled" }
          }
          Must-Fail "unknown name"    "main:`n    print missing"
          Must-Fail "unclosed quote"  "main:`n    print `"abc"
          Must-Fail "wrong arg count" "add a b:`n    return a + b`n`nmain:`n    print add(1)"
          Must-Fail "duplicate job"   "f:`n    return 1`n`nf:`n    return 2`n`nmain:`n    print f()"
          Must-Fail "old syntax"      "main:`n    set x to 3"
          $global:LASTEXITCODE = 0
          exit 0

      - name: libraries, all of them, built and run
        shell: pwsh
        run: |
          $fail = @()
          foreach ($f in Get-ChildItem library\*.sov) {
            $n = $f.BaseName
            if ($n -eq "carm" -or $n -eq "cx86") { continue }
            "use $n`nmain:`n    print 1" | Set-Content -NoNewline lib.sov
            .\sovren.exe lib.sov -o lib.exe 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $fail += "$n (build, exit $LASTEXITCODE)"; continue }
            $g = (.\lib.exe | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { $fail += "$n (run, exit $LASTEXITCODE)"; continue }
            if ($g -ne "1") { $fail += "$n (printed '$g')" }
          }
          "tested $((Get-ChildItem library\*.sov).Count) libraries"
          if ($fail.Count -gt 0) { $fail | ForEach-Object { "  FAIL $_" }; throw "$($fail.Count) libraries failed" }
          "all passed"
          $global:LASTEXITCODE = 0
          exit 0

      - name: hashing matches known answers
        shell: pwsh
        run: |
          function Try-One($name, $src, $want) {
            $src | Set-Content -NoNewline t.sov
            .\sovren.exe t.sov -o t.exe 2>&1 | Out-Null
            $g = (.\t.exe | Out-String).Trim()
            "{0,-10} {1}" -f $name, $g
            if ($g -ne $want) { throw "$name : wanted $want" }
          }
          Try-One "sha256" "use sha256`nmain:`n    print sha256_hex(`"abc`")" "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          Try-One "sha1"   "use sha1`nmain:`n    print sha1_hex(`"abc`")" "a9993e364706816aba3e25717850c26c9cd0d89d"
          Try-One "crc32"  "use crc32`nmain:`n    print crc32_text(`"hello`")" "907060870"
          Try-One "base64" "use base64`nmain:`n    print b64_encode(`"abc`", 3)" "YWJj"
          Try-One "hmac"   "use hmac`nmain:`n    print hmac_sha256(`"key`", `"The quick brown fox jumps over the lazy dog`")" "f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8"
          Try-One "bigint" "use bigint`nmain:`n    print bi_text(bi_fact(20))" "2432902008176640000"
          Try-One "fixed"  "use fixed`nmain:`n    print fx_text(fx_sqrt(fx_from(2)))" "1.414213"
          $global:LASTEXITCODE = 0
          exit 0

      - name: files, folders, arguments
        shell: pwsh
        run: |
          "use file`nmain:`n    file_write_all(`"w.txt`", `"hi there`")`n    print file_read_all(`"w.txt`")" | Set-Content -NoNewline t.sov
          .\sovren.exe t.sov -o t.exe
          $g = (.\t.exe | Out-String).Trim()
          "file round trip : $g"
          if ($g -ne "hi there") { throw "file io broken" }

          "use file`nmain:`n    print file_exists(`"tests/hello.sov`")" | Set-Content -NoNewline t.sov
          .\sovren.exe t.sov -o t.exe
          $g = (.\t.exe | Out-String).Trim()
          "file_exists     : $g"
          if ($g -ne "1") { throw "file_exists broken" }

          "use arg`nmain:`n    print arg_count()`n    print as text arg_at(1)" | Set-Content -NoNewline t.sov
          .\sovren.exe t.sov -o t.exe
          $g = (.\t.exe one two | Out-String).Trim() -replace "`r`n", " "
          "arguments       : $g"
          if ($g -ne "3 one") { throw "arguments broken" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: works from a different folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force elsewhere | Out-Null
          Set-Location elsewhere
          "use string`nmain:`n    print str_copy(`"found its library`")" | Set-Content -NoNewline q.sov
          ..\sovren.exe q.sov -o q.exe
          if ($LASTEXITCODE -ne 0) { throw "could not compile from another folder, exit $LASTEXITCODE" }
          $g = (.\q.exe | Out-String).Trim()
          $g
          if ($g -ne "found its library") { throw "wrong output" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: sovren.exe builds itself, byte for byte
        shell: pwsh
        run: |
          .\sovren.exe compilers\windows\compiler.sov -o gen2.exe
          if ($LASTEXITCODE -ne 0) { throw "self build failed, exit $LASTEXITCODE" }
          .\gen2.exe compilers\windows\compiler.sov -o gen3.exe
          if ($LASTEXITCODE -ne 0) { throw "gen2 could not build, exit $LASTEXITCODE" }
          $a = (Get-FileHash gen2.exe -Algorithm SHA256).Hash
          $b = (Get-FileHash gen3.exe -Algorithm SHA256).Hash
          "gen2 $a"
          "gen3 $b"
          if ($a -ne $b) { throw "not a fixpoint: the compiler does not reproduce itself" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: it can build bare metal too
        shell: pwsh
        run: |
          # sovren.exe is the Windows back end. The target
          # flags are the launcher's job, and the launcher is a Linux
          # program, so only --bare applies here.
          .\sovren.exe tests/hello.sov --bare -o out.bin 2>&1 | Out-Null
          "--bare exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "--bare failed from Windows" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: the example programs
        shell: pwsh
        run: |
          foreach ($f in @("launcher.sov", "tests/hello.sov")) {
            if (-not (Test-Path $f)) { continue }
            .\sovren.exe $f -o ex.exe 2>&1 | Out-Null
            "{0,-14} exit={1}" -f $f, $LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { throw "$f does not compile on Windows" }
          }
          $global:LASTEXITCODE = 0
          exit 0

  # ------------------------------------------------------------------
  macos:
    name: macOS on real hardware
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: which machine is this
        run: |
          sysctl -n machdep.cpu.brand_string || true
          uname -m
          sw_vers

      # The runners are Apple silicon. Sovren's --mac target emits
      # x86-64, so it needs Rosetta. If Rosetta is absent that is the
      # machine's doing, not a fault in the binary, so the checker
      # says so and moves on; the header is checked either way. The
      # checker is itself a Sovren binary (tests/macos-check.sov, built with
      # --mac), so this job is one program, not a Python script.
      - name: the Mach-O we ship is well formed, and runs through Rosetta
        run: |
          test -f tests/macos-check || { echo "tests/macos-check missing from the repo"; exit 1; }
          chmod +x tests/macos-check tests/macos/hello
          file tests/macos/hello tests/macos-check
          # unsigned x86_64 on Apple silicon is often SIGKILL; ad-hoc
          # sign so Rosetta can run it when present
          codesign --force --sign - tests/macos-check tests/macos/hello 2>/dev/null || true
          set +e
          ./tests/macos-check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 137 ] || [ "$code" -eq 126 ] || [ "$code" -eq 134 ]; then
            echo "macos-check did not run (exit $code: no Rosetta or unsigned x86_64 killed)."
            echo "Mach-O header still:"
            file tests/macos/hello tests/macos-check
            hexdump -C -n 16 tests/macos/hello
            hexdump -C -n 16 tests/macos-check
            exit 0
          fi
          exit "$code"

  # ------------------------------------------------------------------
  arm64:
    name: ARM on real hardware
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: which machine is this
        run: |
          uname -m
          grep -m1 "model name\|Model" /proc/cpuinfo || true
          echo "This is a real arm64 cpu, the same kind a phone has."
          echo "The --android target emits ELF + arm64, so a binary built"
          echo "for Android runs here unchanged."

      - name: the prebuilt arm64 binary runs
        run: |
          test -f tests/arm64/check || { echo "tests/arm64/check missing from the repo"; exit 1; }
          chmod +x tests/arm64/check tests/arm64/hello
          file tests/arm64/hello
          ./tests/arm64/check

  # ------------------------------------------------------------------
  linux:
    name: Linux and the emulated targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: which machine is this
        run: |
          grep -m1 "model name" /proc/cpuinfo
          echo "avx512 present:"; grep -o avx512f /proc/cpuinfo | head -1 || echo "  no"
      - name: make things runnable
        # generated from the index, so a renamed or added binary
        # cannot fall off the list the way compiler_so did
        run: |
          git ls-files -z 'sovren' 'sovren.exe' 'sovren-dbg' 'compilers/' 'tests/macos-check' 'tests/macos/hello' 'tests/arm64/check' 'tests/arm64/hello' \
            | grep -zv '\.sov$' | xargs -0 chmod +x
      - name: "bootstrap: the tree rebuilds from one seed"
        run: |
          ./sovren bootstrap.sov -o /tmp/bootstrap
          /tmp/bootstrap
      - name: a screen to draw on
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils imagemagick python3-pil
      - name: the whole suite
        # tests/all.sov is the test battery, written in Sovren.
        # 333 checks in about a minute; tests/run.sov stays local
        # (it cross-builds every library for every target).
        run: |
          ./sovren tests/all.sov -o /tmp/sov-run
          chmod +x /tmp/sov-run
          /tmp/sov-run
      - name: the loop workload
        # The loop workload (sum of the squares 1..n) from
        # tests/bench.sov. The gate is the known sum; a wrong
        # answer is a codegen bug.
        run: |
          N=2900000
          WANT=8129670871667150000
          ./sovren tests/bench.sov -o /tmp/bench-sov
          s=$( /tmp/bench-sov $N )
          test "$s" = "$WANT"
          echo "n = $N, sum of the squares: $s"
      - name: a real window, drawn on a real screen
        run: |
          # win.sov speaks to the X server itself, over a socket.
          # No toolkit, no C library. This starts a screen with no
          # monitor behind it, draws on it, and then looks at what
          # actually landed there.
          export DISPLAY=:95
          Xvfb :95 -nolisten tcp -screen 0 640x480x24 &
          xpid=$!
          sleep 3
          cat > /tmp/w.sov <<'WEOF'
          use win
          use time
          main:
              w: win_open(320, 240, "ciwindow")
              if w is 0
                  print "nodisplay"
                  stop
              i: 0
              as long as i < 30
                  win_fill(w, 0, 0, 320, 240, WIN_WHITE)
                  win_fill(w, 20, 20, 80, 60, WIN_RED)
                  win_box(w, 140, 20, 90, 60, WIN_BLUE)
                  win_line(w, 10, 200, 300, 160, WIN_GREEN)
                  win_text(w, 20, 120, "sovren", WIN_BLACK)
                  win_flush(w)
                  sleep_ms(100)
                  i: i + 1
              print "drew"
          WEOF
          ./sovren /tmp/w.sov -o /tmp/w && chmod +x /tmp/w
          /tmp/w > /tmp/w.txt 2>&1 &
          winpid=$!
          sleep 2
          xwininfo -root -children | grep ciwindow
          import -window root /tmp/shot.png
          python3 -c "
          from PIL import Image
          from collections import Counter
          c = Counter(Image.open('/tmp/shot.png').convert('RGB').getdata())
          print('colours on the screen:', len(c))
          for col, n in c.most_common(6): print(' ', col, n)
          assert len(c) >= 5, 'the drawing did not reach the screen'
          assert (255,0,0) in c, 'the red rectangle is missing'
          assert (0,0,255) in c, 'the blue box is missing'
          assert (0,255,0) in c, 'the green line is missing'
          "
          # wait for the drawing program only. A bare wait would
          # also wait for the screen, which never finishes.
          wait $winpid
          grep -q drew /tmp/w.txt
          kill $xpid 2>/dev/null || true
          echo "a window opened and the drawing reached the screen"
      - name: the bot libraries, against a service we run
        run: |
          # The real services need the locked kind of connection,
          # which is checked separately. What is checked here is
          # everything else: building the request, reading the
          # reply, and pulling the message out of the JSON.
          python3 - <<'PYEOF' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def _send(self, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  if "getMe" in self.path:
                      self._send({"ok":True,"result":{"username":"sovren_test_bot"}})
                  elif "getUpdates" in self.path:
                      self._send({"ok":True,"result":[{"update_id":1,"message":{"message_id":7,"chat":{"id":999},"text":"hello bot","from":{"username":"elxan"}}}]})
                  else:
                      self._send({"ok":True})
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0))
                  self._send({"ok":True,"echo": self.rfile.read(n).decode() if n else ""})
          HTTPServer(("127.0.0.1", 8877), H).serve_forever()
          PYEOF
          srv=$!
          sleep 2
          cat > /tmp/tg.sov <<'TEOF'
          use telegram
          use num
          main:
              t: tg_new("test:token")
              tg_base(t, "http://127.0.0.1:8877")
              print tg_me(t)
              n: tg_poll(t)
              print num_text(n)
              print tg_text(t, 0)
              print num_text(tg_chat(t, 0))
              print num_text(tg_say(t, 999, "hi back"))
          TEOF
          ./sovren /tmp/tg.sov -o /tmp/tg && chmod +x /tmp/tg
          /tmp/tg | tee /tmp/tg.txt
          grep -q sovren_test_bot /tmp/tg.txt
          grep -q "hello bot" /tmp/tg.txt
          grep -q 999 /tmp/tg.txt
          kill $srv 2>/dev/null || true
          echo "the telegram library reads messages and sends replies"
      - name: a Windows exe and a Mac binary, run here, in Sovren
        run: |
          # library/x86.sov is a processor written in Sovren. It runs
          # the PE and the Mach-O this compiler emits, with no Wine,
          # no Unicorn and no Python. It is strict where Wine is not.
          ./sovren tests/windows-run.sov -o /tmp/wrun && chmod +x /tmp/wrun
          ./sovren tests/macos-run.sov -o /tmp/mrun && chmod +x /tmp/mrun
          ./sovren tests/hello.sov --windows -o /tmp/h.exe
          ./sovren tests/hello.sov --mac -o /tmp/h.mac
          /tmp/wrun /tmp/h.exe > /tmp/w.txt
          /tmp/mrun /tmp/h.mac > /tmp/m.txt
          cat /tmp/w.txt
          head -1 /tmp/w.txt | grep -q "Hello from Sovren"
          diff /tmp/w.txt /tmp/m.txt
          echo "the exe and the Mac binary print the same thing"
      - name: the Windows compiler, run inside the Sovren emulator
        run: |
          # The compiler for Windows, running on a processor written
          # in Sovren, compiling a real program. The exe it writes
          # must match the one built natively, byte for byte, and
          # the exe must run.
          #
          # Note: compiling the whole of compilers/windows/compiler.sov inside
          # the emulator was tried at a 40,000,000,000 step budget
          # and did not finish in a sensible time: the emulator does
          # about 2.5M steps a second on that workload, so the full
          # self build needs twenty minutes or more. tests/hello.sov uses
          # the same compiler, the same code path, and finishes in
          # under a second, so it proves the same thing cheaply.
          cat > /tmp/emubuild.sov <<'EOF'
          use x86
          use string
          main:
              m: x86_new()
              if x86_load(m, "sovren.exe") is 0
                  print "cannot load sovren.exe"
                  stop
              x_set_cmdline(m, "sovren.exe tests/hello.sov -o /tmp/hello-emu.exe")
              x86_run_for(m, 500000000)
              write_out(x86_out(m))
              write_out(x86_err(m))
              print x86_reason(m)
          EOF
          ./sovren /tmp/emubuild.sov -o /tmp/emubuild && chmod +x /tmp/emubuild
          /tmp/emubuild | tee /tmp/emubuild.txt
          grep -q "Wrote" /tmp/emubuild.txt
          grep -q "done" /tmp/emubuild.txt
          test -f /tmp/hello-emu.exe
          ./sovren tests/hello.sov --windows -o /tmp/hello-native.exe
          a=$(sha256sum /tmp/hello-emu.exe | cut -d' ' -f1)
          b=$(sha256sum /tmp/hello-native.exe | cut -d' ' -f1)
          echo "from emu $a"
          echo "native  $b"
          test "$a" = "$b"
          ./sovren tests/windows-run.sov -o /tmp/wrun && chmod +x /tmp/wrun
          /tmp/wrun /tmp/hello-emu.exe | grep -q "Hello from Sovren"
          echo "the exe built inside the emulator is byte-identical and runs"
      - name: self host, byte for byte, three times
        run: |
          ./sovren compilers/linux/compiler.sov -o /tmp/g1 && chmod +x /tmp/g1
          /tmp/g1 compilers/linux/compiler.sov -o /tmp/g2 && chmod +x /tmp/g2
          /tmp/g2 compilers/linux/compiler.sov -o /tmp/g3
          a=$(sha256sum compilers/linux/compiler | cut -d' ' -f1)
          b=$(sha256sum /tmp/g3 | cut -d' ' -f1)
          echo "shipped $a"
          echo "gen3    $b"
          test "$a" = "$b"
      - name: every library on every target
        run: |
          fail=0
          for t in "" --windows --mac --android --ios --android-so; do
            for f in library/*.sov; do
              n=$(basename "$f" .sov)
              # carm and cx86 are the shared compiler cores, not
              # libraries: they reach globals the compiler source
              # defines (oc, err_line and friends), so `use carm` on
              # its own has nothing to resolve against. they are still
              # compiled, three times over, by the self-host step
              case "$n" in carm|cx86) continue;; esac
              printf 'use %s\nmain:\n    print 1\n' "$n" > /tmp/L.sov
              if ! ./sovren /tmp/L.sov $t -o /tmp/L.bin >/dev/null 2>&1; then
                echo "  FAIL $n ${t:-linux}"; fail=$((fail+1))
              fi
            done
          done
          echo "failures: $fail"
          test "$fail" = "0"
      - name: no warnings from any compiler
        run: |
          w=0
          for c in linux windows macos android ios; do
            n=$(./sovren compilers/$c/compiler.sov -o /tmp/c.bin 2>&1 | grep -ci warning || true)
            echo "$c: $n warnings"
            w=$((w+n))
          done
          test "$w" = "0"
