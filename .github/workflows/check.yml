name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build compilers
      run: |
        ./compilers/linux/compiler compilers/linux/compiler.sov -o compilers/linux/compiler
        chmod +x compilers/linux/compiler
    
    - name: Test paren-free calls
      run: |
        cat > /tmp/test.sov << 'END'
add a, b:
    return a + b

x: add 5, 10
print x
END
        ./compilers/linux/compiler /tmp/test.sov -o /tmp/test
        /tmp/test | grep -q "15"
    
    - name: Test statement calls
      run: |
        cat > /tmp/test2.sov << 'END'
greet name:
    print "Hello"

greet "World"
END
        ./compilers/linux/compiler /tmp/test2.sov -o /tmp/test2
        /tmp/test2 | grep -q "Hello"
    
    - name: Test all libraries compile
      run: |
        for lib in library/*.sov; do
          name=$(basename "$lib" .sov)
          if [ "$name" != "carm" ] && [ "$name" != "cx86" ]; then
            cat > /tmp/testlib.sov << END
use $name
print 1
END
            ./compilers/linux/compiler /tmp/testlib.sov -o /tmp/testlib 2>&1 | grep -q "Error" && exit 1 || true
          fi
        done
    
    - name: Bootstrap test
      run: |
        ./compilers/linux/compiler compilers/linux/compiler.sov -o /tmp/gen1
        chmod +x /tmp/gen1
        /tmp/gen1 compilers/linux/compiler.sov -o /tmp/gen2
        /tmp/gen2 compilers/linux/compiler.sov -o /tmp/gen3
        # All three should be identical
        cmp /tmp/gen1 /tmp/gen2 || exit 1
        cmp /tmp/gen2 /tmp/gen3 || exit 1
