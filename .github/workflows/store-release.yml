name: Microsoft Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.3
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: microsoft-store-production
  cancel-in-progress: false

jobs:
  validate-release:
    name: Complete cross-target release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore executable modes defensively
        shell: bash
        run: |
          chmod +x sovren bootstrap sovren-dbg
          find compilers -maxdepth 2 -type f -name 'compiler*' -exec chmod +x {} +

      - name: Verify fixed-point multi-target bootstrap
        shell: bash
        run: |
          set -o pipefail
          ./bootstrap 2>&1 | tee store-bootstrap.log
          grep -Fx 'bootstrap clean' store-bootstrap.log

      - name: Run complete language and library suite
        shell: bash
        run: |
          set -o pipefail
          ./sovren tests/all.sov -o store-all
          ./store-all 2>&1 | tee store-complete-tests.log
          grep -E '^[0-9]+ passed, 0 failed$' store-complete-tests.log
          grep -Fx 'all checks passed' store-complete-tests.log

      - name: Retain validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sovren-complete-release-validation
          path: |
            store-bootstrap.log
            store-complete-tests.log
          if-no-files-found: error
          retention-days: 30

  build-msix:
    name: Build and validate Store MSIX
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      package-name: ${{ steps.names.outputs.package-name }}
      package-version: ${{ steps.version.outputs.msix }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Partner Center package identity
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in @('IDENTITY_NAME', 'PUBLISHER', 'PUBLISHER_DISPLAY_NAME')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing GitHub repository variable STORE_$name. Copy the exact value from Partner Center Product identity."
            }
          }

      - name: Convert release version to MSIX version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $raw = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:DISPATCH_VERSION }
          $raw = $raw.Trim().TrimStart('v')
          if ($raw -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version must be three or four numbers (for example 1.2.3); got '$raw'."
          }
          $parts = @($raw.Split('.'))
          if ($parts.Count -eq 3) { $parts += '0' }
          foreach ($part in $parts) {
            $number = [int]$part
            if ($number -lt 0 -or $number -gt 65535) { throw "Version component out of range: $part" }
          }
          if ([int]$parts[0] -lt 1) { throw 'Major version must be at least 1.' }
          $msix = $parts -join '.'
          "msix=$msix" >> $env:GITHUB_OUTPUT
          "MSIX version: $msix"

      - name: Rebuild the Windows compiler to a fixed point
        shell: pwsh
        run: |
          .\sovren.exe compilers\windows\compiler.sov -o store-gen1.exe
          if ($LASTEXITCODE -ne 0) { throw "seed compiler failed: $LASTEXITCODE" }
          .\store-gen1.exe compilers\windows\compiler.sov -o store-gen2.exe
          if ($LASTEXITCODE -ne 0) { throw "generation 1 failed: $LASTEXITCODE" }
          .\store-gen2.exe compilers\windows\compiler.sov -o store-gen3.exe
          if ($LASTEXITCODE -ne 0) { throw "generation 2 failed: $LASTEXITCODE" }
          $h2 = (Get-FileHash store-gen2.exe -Algorithm SHA256).Hash
          $h3 = (Get-FileHash store-gen3.exe -Algorithm SHA256).Hash
          "generation 2: $h2"
          "generation 3: $h3"
          if ($h2 -ne $h3) { throw 'Windows compiler did not reach a byte-identical fixed point.' }

      - name: Exercise the release compiler
        shell: pwsh
        run: |
          "main:`n    print 4242" | Set-Content -NoNewline store-smoke.sov
          .\store-gen3.exe store-smoke.sov -o store-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "release compiler failed to compile smoke source: $LASTEXITCODE" }
          $actual = (.\store-smoke.exe | Out-String).Trim()
          if ($actual -ne '4242') { throw "release compiler smoke output was '$actual', expected 4242." }

      - name: Run Windows language and library release validation
        shell: pwsh
        run: |
          $log = [Collections.Generic.List[string]]::new()
          .\store-gen3.exe tests\hello.sov -o store-hello.exe
          if ($LASTEXITCODE -ne 0) { throw "hello compile failed: $LASTEXITCODE" }
          $hello = (.\store-hello.exe | Out-String).Trim()
          if ($hello -notmatch 'Hello from Sovren') { throw "hello output was '$hello'" }
          $log.Add("hello: passed")

          $failed = [Collections.Generic.List[string]]::new()
          $tested = 0
          foreach ($file in Get-ChildItem library\*.sov) {
            $name = $file.BaseName
            if ($name -eq 'carm' -or $name -eq 'cx86') { continue }
            "use $name`nmain:`n    print 1" | Set-Content -NoNewline store-library.sov
            .\store-gen3.exe store-library.sov -o store-library.exe 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed.Add("$name build"); continue }
            $actual = (.\store-library.exe | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne '1') { $failed.Add("$name run"); continue }
            $tested++
          }
          if ($failed.Count -ne 0) { throw "Library failures: $($failed -join ', ')" }
          $log.Add("libraries: $tested passed, 0 failed")

          "main:`n    print missing" | Set-Content -NoNewline store-invalid.sov
          .\store-gen3.exe store-invalid.sov -o store-invalid.exe 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Malformed source was accepted.' }
          $log.Add('malformed source rejection: passed')
          $log.Add('Windows release validation: all checks passed')
          $log | Set-Content store-tests.log
          $log | ForEach-Object { Write-Host $_ }

      - name: Build unsigned package for Microsoft certification
        id: package
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          MSIX_VERSION: ${{ steps.version.outputs.msix }}
        run: |
          .\tools\build-store-package.ps1 `
            -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME `
            -Version $env:MSIX_VERSION `
            -SourceExe .\store-gen3.exe `
            -OutputDirectory .\artifacts\store

      - name: Record artifact name
        id: names
        shell: pwsh
        env:
          MSIX_VERSION: ${{ steps.version.outputs.msix }}
        run: '"package-name=Sovren-$env:MSIX_VERSION-x64.msix" >> $env:GITHUB_OUTPUT'

      - name: Upload certification package
        uses: actions/upload-artifact@v4
        with:
          name: sovren-store-${{ steps.version.outputs.msix }}
          path: |
            artifacts/store/*.msix
            artifacts/store/*.sha256
            store-tests.log
          if-no-files-found: error
          retention-days: 30

  publish-update:
    name: Submit update to Microsoft Store
    needs: build-msix
    if: ${{ vars.STORE_AUTOPUBLISH == 'true' }}
    runs-on: windows-latest
    environment: microsoft-store
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sovren-store-${{ needs.build-msix.outputs.package-version }}
          path: artifacts/store

      - name: Require live Store product
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCT_ID)) {
            throw 'Missing STORE_PRODUCT_ID. The first Partner Center submission must be completed manually before automatic updates are enabled.'
          }

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Authenticate without exposing credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          foreach ($name in @('TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing Store credential: $name" }
          }
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET

      - name: Submit and publish package update
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          PACKAGE_NAME: ${{ needs.build-msix.outputs.package-name }}
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts\store\$env:PACKAGE_NAME"
          if (-not (Test-Path $package)) { throw "Downloaded package not found: $package" }
          msstore publish $env:GITHUB_WORKSPACE --inputFile $package --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Store submission failed: $LASTEXITCODE" }
