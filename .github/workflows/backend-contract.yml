name: Shared backend correctness
on:
  workflow_dispatch:
  push:
    paths: ['frontend/**', 'ir/**', 'backends/**', 'runtime/**', 'library/**', 'compilers/**', 'tools/**', 'tests/**', '.github/workflows/backend-contract.yml']
  pull_request:
    paths: ['frontend/**', 'ir/**', 'backends/**', 'runtime/**', 'library/**', 'compilers/**', 'tools/**', 'tests/**']
permissions:
  contents: read
jobs:
  shared-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/sovren-tools" typescript@5.9.3
      - name: Verify installed source, binary and runtime contract
        run: |
          find compilers -name compiler -exec chmod +x {} +
          python3 tools/backend_checks.py --tsc "$RUNNER_TEMP/sovren-tools/node_modules/.bin/tsc" --output work/releases/v58/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-backend-correctness
          path: work/releases/v58/ci/*.json
# This Linux job is not Windows/macOS host validation or a full-language gate.
